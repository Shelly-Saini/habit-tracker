apiVersion: apps/v1
kind: Deployment
metadata:
  name: habit-tracker-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: habit-tracker-backend
  template:
    metadata:
      labels:
        app: habit-tracker-backend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: backend
          image: habit-tracker-git-backend:k8s-v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "256Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
              ephemeral-storage: "512Mi"
          env:
            - name: PORT
              value: "5000"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: habit-tracker-secret
                  key: MONGO_URI