apiVersion: apps/v1
kind: Deployment
metadata:
  name: habit-tracker-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: habit-tracker-frontend
  template:
    metadata:
      labels:
        app: habit-tracker-frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: habit-tracker-git-frontend:k8s-v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "256Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
              ephemeral-storage: "512Mi"